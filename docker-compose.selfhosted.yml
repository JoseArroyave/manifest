# Self-hosted stack that BUILDS Manifest from this repo's source instead of
# pulling the prebuilt image from Docker Hub. Use this when you want to run
# your own local checkout.
#
#   1. cp docker-compose.selfhosted.env.example .env
#   2. Set BETTER_AUTH_SECRET in .env   (openssl rand -hex 32)
#   3. docker compose -f docker-compose.selfhosted.yml up -d --build
#   4. Open http://localhost:2099 and finish the setup wizard at /setup
#
# The official prebuilt-image stack lives at docker/docker-compose.yml. This
# file mirrors its hardening and env surface but swaps `image:` for a local
# `build:` so the backend/frontend are compiled from ./packages via
# docker/Dockerfile.

name: mnfst-selfhosted

services:
  manifest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: manifest-selfhosted:local
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-${PORT:-2099}}:${PORT:-2099}"
    # Lets the container reach LLM servers running on the host (Ollama,
    # LM Studio, or any OpenAI-compatible server) at
    # host.docker.internal:<port>. Requires Docker Engine 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${PORT:-2099}
      - DATABASE_URL=${DATABASE_URL:-postgresql://manifest:manifest@postgres:5432/manifest}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env}
      # Optional dedicated at-rest encryption key for stored provider/OAuth
      # credentials. When unset, the backend falls back to BETTER_AUTH_SECRET.
      - MANIFEST_ENCRYPTION_KEY=${MANIFEST_ENCRYPTION_KEY:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:${HOST_PORT:-${PORT:-2099}}}
      - BETTER_AUTH_ALLOWED_HOSTS=${BETTER_AUTH_ALLOWED_HOSTS:-}
      - MCP_ENABLED=${MCP_ENABLED:-}
      # Defaults to a host-installed Ollama. Override in .env if it runs elsewhere.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PROVIDER_TIMEOUT_MS=${PROVIDER_TIMEOUT_MS:-180000}
      - STREAM_WARMUP_MS=${STREAM_WARMUP_MS:-15000}
      - CODEX_SEMANTIC_OUTPUT_TIMEOUT_MS=${CODEX_SEMANTIC_OUTPUT_TIMEOUT_MS:-60000}
      - MANIFEST_CONCURRENCY_MAX=${MANIFEST_CONCURRENCY_MAX:-10}
      - MANIFEST_RATE_MAX_REQUESTS=${MANIFEST_RATE_MAX_REQUESTS:-200}
      - MANIFEST_IP_RATE_MAX_REQUESTS=${MANIFEST_IP_RATE_MAX_REQUESTS:-500}
      - SEED_DATA=false
      - NODE_ENV=production
      # Force self-hosted semantics regardless of the container runtime.
      - MANIFEST_MODE=${MANIFEST_MODE:-selfhosted}
      # Message recordings fall back to the mounted volume when no S3 creds are set.
      - REQUEST_RECORDING_STORAGE=${REQUEST_RECORDING_STORAGE:-auto}
      - REQUEST_RECORDING_FILESYSTEM_PATH=/data/request-recordings
      - REQUEST_RECORDING_RETENTION_DAYS=${REQUEST_RECORDING_RETENTION_DAYS:-}
      - REQUEST_RECORDING_S3_BUCKET=${REQUEST_RECORDING_S3_BUCKET:-}
      - REQUEST_RECORDING_S3_ENDPOINT=${REQUEST_RECORDING_S3_ENDPOINT:-}
      - REQUEST_RECORDING_S3_REGION=${REQUEST_RECORDING_S3_REGION:-}
      - REQUEST_RECORDING_S3_ACCESS_KEY_ID=${REQUEST_RECORDING_S3_ACCESS_KEY_ID:-}
      - REQUEST_RECORDING_S3_SECRET_ACCESS_KEY=${REQUEST_RECORDING_S3_SECRET_ACCESS_KEY:-}
      - REQUEST_RECORDING_S3_FORCE_PATH_STYLE=${REQUEST_RECORDING_S3_FORCE_PATH_STYLE:-false}
      # Email provider (optional): resend, mailgun, sendgrid.
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_DOMAIN=${EMAIL_DOMAIN:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      # OAuth providers (optional). Activate when both ID and SECRET are set.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - OPENAI_OAUTH_CLIENT_ID=${OPENAI_OAUTH_CLIENT_ID:-}
      - MINIMAX_OAUTH_CLIENT_ID=${MINIMAX_OAUTH_CLIENT_ID:-}
      - API_KEY=${API_KEY:-}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - AUTH_DB_POOL_MAX=${AUTH_DB_POOL_MAX:-5}
      - DB_TUNE_SESSION=${DB_TUNE_SESSION:-}
      - RUN_MIGRATIONS_ON_BOOT=${RUN_MIGRATIONS_ON_BOOT:-true}
      - SHUTDOWN_DRAIN_MS=${SHUTDOWN_DRAIN_MS:-10000}
      - MANIFEST_DISABLE_HSTS=${MANIFEST_DISABLE_HSTS:-}
      - WINGMAN_CORS_ORIGINS=${WINGMAN_CORS_ORIGINS:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - MANIFEST_TELEMETRY_DISABLED=${MANIFEST_TELEMETRY_DISABLED:-0}
      - TELEMETRY_ENDPOINT=${TELEMETRY_ENDPOINT:-}
      - AGENT_USAGE_DAILY_WORKER=${AGENT_USAGE_DAILY_WORKER:-}
      - AGENT_USAGE_DAILY_READS=${AGENT_USAGE_DAILY_READS:-}
      - AGENT_USAGE_DAILY_READ_TENANTS=${AGENT_USAGE_DAILY_READ_TENANTS:-}
      - AGENT_USAGE_DAILY_BATCH_SIZE=${AGENT_USAGE_DAILY_BATCH_SIZE:-}
      - AGENT_USAGE_DAILY_RUN_BUDGET_MS=${AGENT_USAGE_DAILY_RUN_BUDGET_MS:-}
      - MANIFEST_UPDATE_CHECK_DISABLED=${MANIFEST_UPDATE_CHECK_DISABLED:-0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "const p=process.env.PORT||'2099';fetch(`http://127.0.0.1:$${p}/api/v1/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      # Cold first-boot runs migrations + pricing-cache warmup; give it room.
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 512
    volumes:
      - recordings:/data/request-recordings
    networks:
      - internal
      - frontend

  postgres:
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    restart: unless-stopped
    environment:
      - POSTGRES_USER=manifest
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-manifest}
      - POSTGRES_DB=manifest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U manifest
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  pgdata:
    name: manifest_selfhosted_pgdata
  recordings:
    name: manifest_selfhosted_request_recordings
